{{- /* Hook-scoped copy of the database URL for the migration Job. The
     regular chart Secret does not exist yet when pre-install hooks run,
     and on upgrades it still holds the previous revision's values, so the
     Job gets its own Secret created in the same hook phase (with a lower
     weight so it exists before the Job starts). hook-succeeded is safe
     despite the lower weight: Helm deletes hook-succeeded resources only
     after every hook of the event has completed, so the Secret outlives
     the Job run and is cleaned up with it on success. After a failed
     migration both linger for debugging (and are replaced on the next run
     via before-hook-creation). */ -}}
{{- if and .Values.database.enabled .Values.database.migration.enabled .Values.database.url (not .Values.database.existingUrlSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-migrate" (include "open-connector.fullname" . | trunc 55 | trimSuffix "-") }}
  labels:
    {{- include "open-connector.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  databaseUrl: {{ .Values.database.url | quote }}
{{- end }}
