{{- /* Dedicated Secret for an inline database URL, so credentials never
     land in the ConfigMap and the name cannot collide with a
     `secret.existingSecret` that happens to match the release fullname.
     Rendered independently of the app Secret because an external app
     Secret can be combined with an inline database URL. */ -}}
{{- if and .Values.database.enabled .Values.database.url (not .Values.database.existingUrlSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db" (include "open-connector.fullname" . | trunc 60 | trimSuffix "-") }}
  labels:
    {{- include "open-connector.labels" . | nindent 4 }}
type: Opaque
stringData:
  databaseUrl: {{ .Values.database.url | quote }}
{{- end }}
