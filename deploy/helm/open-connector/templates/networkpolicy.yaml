{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "open-connector.fullname" . }}
  labels:
    {{- include "open-connector.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "open-connector.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
    {{- with .Values.networkPolicy.additionalIngressNamespaceSelector }}
    - from:
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
      ports:
        - protocol: TCP
          port: 3000
    {{- end }}
{{- end }}