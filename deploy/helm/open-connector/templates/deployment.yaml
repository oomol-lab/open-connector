apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open-connector.fullname" . }}
  labels:
    {{- include "open-connector.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "open-connector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "open-connector.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{ toYaml . }}
        {{- end }}
      annotations:
        # Roll the pod when the Secret or ConfigMap changes; secrets and
        # configmaps aren't auto-detected by the kubelet.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{ toYaml . }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "open-connector.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: open-connector
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "open-connector.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "open-connector.fullname" . }}
          env:
            {{- if .Values.secret.existingSecret }}
            {{- range $key := .Values.secret.secretKeys }}
            - name: {{ include "open-connector.secretEnvName" $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secret.existingSecret }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
            {{- else }}
            {{- range $key := .Values.secret.secretKeys }}
            - name: {{ include "open-connector.secretEnvName" $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-connector.secretName" $ }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- if and .Values.database.enabled .Values.database.existingUrlSecret }}
            - name: OOMOL_CONNECT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingUrlSecret }}
                  key: {{ .Values.database.existingUrlSecretKey | default "url" }}
                  optional: false
            - name: OOMOL_CONNECT_DATABASE_POOL_MAX
              value: {{ .Values.database.poolMax | quote }}
            - name: OOMOL_CONNECT_DATABASE_CONNECT_TIMEOUT_MS
              value: {{ .Values.database.connectTimeoutMs | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- with .Values.extraVolumeMounts }}
            {{ toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
          {{- else if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "open-connector.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.extraVolumes }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.podAntiAffinity.preferredDuringScheduling }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "open-connector.selectorLabels" . | nindent 14 }}
      {{- end }}