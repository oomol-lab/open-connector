{{- /* The chart-managed Secret carries the app secrets (unless an external
     Secret is referenced) and, when database.url is set inline, the
     PostgreSQL connection URL - credentials never land in the ConfigMap. */ -}}
{{- $inlineDatabaseUrl := and .Values.database.enabled .Values.database.url (not .Values.database.existingUrlSecret) }}
{{- if or (not .Values.secret.existingSecret) $inlineDatabaseUrl -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-connector.fullname" . }}
  labels:
    {{- include "open-connector.labels" . | nindent 4 }}
  {{- with .Values.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- if not .Values.secret.existingSecret }}
  {{- range $key := .Values.secret.secretKeys }}
  {{- $value := index $.Values.secret $key -}}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $inlineDatabaseUrl }}
  databaseUrl: {{ .Values.database.url | quote }}
  {{- end }}
{{- end }}
