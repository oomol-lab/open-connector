{{- /*
  Guard rail: refuse to install unless the admin surface can be
  authenticated. Set `secret.adminToken` or `secret.existingSecret`,
  or explicitly opt in to local experimentation with
  `insecureDevelopment: true`.

  When an external Secret is referenced, require `adminToken` to be
  listed in `secret.secretKeys`. Without that key, the Deployment
  renders `OOMOL_CONNECT_ADMIN_TOKEN` with `optional: true`, the
  lookup silently misses, and the admin surface starts unauthenticated.
*/ -}}
{{- if not (or .Values.secret.adminToken .Values.secret.existingSecret .Values.insecureDevelopment) }}
{{- fail "open-connector: secret.adminToken or secret.existingSecret must be set. For local experimentation only, pass --set insecureDevelopment=true. Do NOT enable insecureDevelopment in any environment reachable outside the loopback." }}
{{- end }}
{{- if .Values.secret.existingSecret }}
{{- if not (has "adminToken" .Values.secret.secretKeys) }}
{{- fail "open-connector: when secret.existingSecret is set, secret.secretKeys must include 'adminToken'. Without it the admin surface is unauthenticated." }}
{{- end }}
{{- end }}
{{- if .Values.database.enabled }}
{{- if and .Values.database.url .Values.database.existingUrlSecret }}
{{- fail "open-connector: set either database.url or database.existingUrlSecret, not both." }}
{{- end }}
{{- if not (or .Values.database.url .Values.database.existingUrlSecret) }}
{{- fail "open-connector: database.enabled=true requires database.url or database.existingUrlSecret. Without a URL the runtime silently falls back to SQLite." }}
{{- end }}
{{- end }}
{{- /*
  The data volume is shared by every replica. A single SQLite file must
  never be opened by more than one pod, and a ReadWriteOnce PVC cannot be
  mounted across nodes, so multi-replica setups must move their state out
  of the volume entirely.
*/ -}}
{{- $maxReplicas := int (ternary .Values.autoscaling.maxReplicas .Values.replicaCount .Values.autoscaling.enabled) }}
{{- if and .Values.persistence.enabled (gt $maxReplicas 1) }}
{{- if not .Values.database.enabled }}
{{- fail "open-connector: more than one replica (replicaCount or autoscaling.maxReplicas) requires PostgreSQL (database.enabled=true) - the default SQLite database cannot be shared between pods." }}
{{- end }}
{{- if not (has "ReadWriteMany" .Values.persistence.accessModes) }}
{{- fail "open-connector: more than one replica with persistence.enabled=true requires a ReadWriteMany PVC. Either set persistence.enabled=false (with database.enabled=true and config.transitFileBackend=s3) or use an RWX storage class in persistence.accessModes." }}
{{- end }}
{{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "open-connector.fullname" . }}
  labels:
    {{- include "open-connector.labels" . | nindent 4 }}
data:
{{- /* Merge the dataDir default in before rendering so the env loop stays uniform. */}}
{{- $config := merge (dict) .Values.config }}
{{- if not $config.dataDir }}
{{- $_ := set $config "dataDir" .Values.persistence.mountPath }}
{{- end }}
{{- range $key, $value := $config }}
  {{- $envName := include "open-connector.configEnvName" $key }}
  {{- /* Skip empty strings: an empty env var would override the runtime's
         built-in default (e.g. OOMOL_CONNECT_ORIGIN="" breaks OAuth
         redirect URLs), while booleans and numbers always render. */}}
  {{- if or (eq (printf "%T" $value) "float64") (eq (printf "%T" $value) "int") }}
  {{ $envName }}: {{ $value | int | quote }}
  {{- else if or $value (eq (printf "%T" $value) "bool") }}
  {{ $envName }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- if .Values.database.enabled }}
  OOMOL_CONNECT_DATABASE_POOL_MAX: {{ .Values.database.poolMax | quote }}
  OOMOL_CONNECT_DATABASE_CONNECT_TIMEOUT_MS: {{ .Values.database.connectTimeoutMs | quote }}
{{- end }}
  NODE_ENV: production
  PORT: "3000"
  HOST: 0.0.0.0
