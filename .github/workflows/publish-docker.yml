name: Publish Docker Image

# Builds docker/Dockerfile for linux/amd64 and pushes it to GHCR on every push to
# main (this includes merged PRs), tagged `tip` and the commit SHA.
#
# amd64 only: production targets amd64 servers. Developers on Apple Silicon build
# their own local arm64 image with docker-compose.build.yml instead of CI
# publishing a second architecture nobody deploys.
#
# Versioned releases (vX.Y.Z + latest) are built separately by
# promote-production.yml, from the exact commit being promoted, not by this
# workflow — so a release build can never race or duplicate a tip build.
on:
  push:
    branches: [main]

# A newer commit cancels an older, still-running build — keeps `tip` pointing at
# the most recent commit.
concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: true

# Reusable workflow calls are capped by what the caller grants — without this,
# the token falls back to the repo/org default (packages: read here), and
# build-image.yml's own `packages: write` request gets rejected.
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push
    uses: ./.github/workflows/build-image.yml
    with:
      tags: |
        ghcr.io/${{ github.repository }}:tip
        ghcr.io/${{ github.repository }}:${{ github.sha }}
