name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same ref (e.g. new push to an open PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this job only reads the repository.
permissions:
  contents: read

env:
  # This project runs TypeScript directly with `node` (native type stripping) and
  # forbids `tsx` / `--experimental-strip-types` (see AGENTS.md). Type stripping is
  # on by default only on Node >= 22.18 / >= 23.6, so pin an LTS that supports it.
  # Do NOT downgrade below 22.18 — `npm ci` (postinstall codegen) and typecheck fail.
  NODE_VERSION: "24"

jobs:
  ci:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No step needs the persisted GITHUB_TOKEN in git config; dropping it
          # keeps `npm ci` postinstall scripts from reading it (zizmor hardening).
          persist-credentials: false

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Runs postinstall codegen (provider registry + catalog).
      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Check formatting (oxfmt)
        run: npm run format

      # Typecheck: regenerates the registry, type-checks src/scripts/examples.
      - name: Typecheck
        run: npm run typecheck

      - name: Build web
        run: npm run build:web

      # Action examples: generate the catalog as the docs build does, then validate every
      # schema-derived example against its action's input schema, as AGENTS.md requires.
      - name: Validate action examples
        run: npm run generate:catalog && node scripts/check-action-examples.ts

  test:
    name: Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: open_connector_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/open_connector_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run tests
        run: npm test -- --shard=${{ matrix.shard }}/4
