name: Publish Helm chart

# Lints the chart at deploy/helm/open-connector on pull requests, and pushes
# it to GitHub Packages (ghcr.io) as an OCI artifact:
#
#   push to main        -> <chart-version>-tip.<full-sha>  (immutable ref,
#                                                           one per commit)
#   published release   -> <chart-version>                 (only when the
#                                                           chart version
#                                                           matches the
#                                                           release tag;
#                                                           app releases
#                                                           are skipped)
#                          + latest                        (non-prerelease
#                                                           only)
#
# Pulling the published chart:
#   helm pull oci://ghcr.io/$OWNER/charts/open-connector --version 0.1.0
#
# ghcr.io packages are private by default and the REST API cannot change
# package visibility, so after the first publish flip the
# `charts/open-connector` package to public once in the GitHub Packages UI.
on:
  pull_request:
    paths:
      - "deploy/helm/open-connector/**"
      - ".github/workflows/publish-helm.yml"
  push:
    branches: [main]
    paths:
      - "deploy/helm/open-connector/**"
      - ".github/workflows/publish-helm.yml"
  release:
    types: [published]
  workflow_dispatch:

# Least privilege: read the repo, write to push packages to ghcr.io.
permissions:
  contents: read
  packages: write

# One in-flight publish per ref. main-branch pushes share a group so a
# newer commit cancels an older, still-running build - this keeps the
# "tip" tag pointing at the most recent commit. Releases use their own
# per-tag group and are never cancelled.
concurrency:
  group: publish-helm-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  lint:
    name: Lint chart
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CHART_PATH: deploy/helm/open-connector
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.2.4

      - name: Helm lint
        run: helm lint "${CHART_PATH}" --set secret.adminToken=ci-lint-token

      - name: Render smoke tests
        run: |
          set -euo pipefail
          # Default (SQLite) shape.
          helm template smoke "${CHART_PATH}" \
            --set secret.adminToken=ci-lint-token >/dev/null
          # PostgreSQL shape incl. migration hook resources.
          helm template smoke "${CHART_PATH}" \
            --set secret.adminToken=ci-lint-token \
            --set database.enabled=true \
            --set database.url=postgresql://user:pass@db:5432/oc >/dev/null
          echo "Rendered default and PostgreSQL shapes successfully."

  publish:
    name: Publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CHART_PATH: deploy/helm/open-connector
      # ghcr.io requires OCI artifacts to be linked to a repository. We use
      # a dedicated "charts" namespace inside the owner's account so the
      # package name is `charts/open-connector`, distinct from the docker
      # image package `open-connector`. Override here to push elsewhere
      # (e.g. oci://ghcr.io/${{ github.repository_owner }}/open-connector/helm).
      OCI_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Helm
        id: setup-helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.2.4

      - name: Read chart metadata
        id: meta
        run: |
          version=$(grep '^version:' "${{ env.CHART_PATH }}/Chart.yaml" | awk '{print $2}')
          name=$(grep '^name:'    "${{ env.CHART_PATH }}/Chart.yaml" | head -1 | awk '{print $2}')
          if [[ -z "${version}" || -z "${name}" ]]; then
            echo "::error::Could not read name/version from Chart.yaml"
            exit 1
          fi
          echo "name=${name}"       >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Chart: ${name} v${version}"

      # Derive registry host, namespace, and full package name from
      # OCI_REPO so every downstream step (login, helm push, ORAS copy,
      # gh API, install instructions) consumes the same configured target.
      # Override OCI_REPO at the job level and the change propagates.
      - name: Parse OCI_REPO
        id: oci
        env:
          OCI_REPO: ${{ env.OCI_REPO }}
          CHART_NAME: ${{ steps.meta.outputs.name }}
        run: |
          set -euo pipefail
          oci_repo="${OCI_REPO}"
          if [[ "${oci_repo}" != oci://* ]]; then
            echo "::error::OCI_REPO must start with 'oci://' (got '${oci_repo}')"
            exit 1
          fi
          no_proto="${oci_repo#oci://}"
          host="${no_proto%%/*}"
          rest="${no_proto#*/}"
          if [[ -z "${host}" || -z "${rest}" || "${rest}" == "${no_proto}" ]]; then
            echo "::error::OCI_REPO must include a host and namespace (got '${oci_repo}')"
            exit 1
          fi
          namespace="${rest}"
          chart_name="${CHART_NAME}"
          package_name="${namespace}/${chart_name}"
          owner="${namespace%%/*}"
          if [[ -z "${owner}" || "${owner}" == "${namespace}" ]]; then
            echo "::error::OCI_REPO namespace must include an owner (got '${namespace}')"
            exit 1
          fi
          {
            echo "host=${host}"
            echo "namespace=${namespace}"
            echo "chart_name=${chart_name}"
            echo "package_name=${package_name}"
            echo "owner=${owner}"
          } >> "$GITHUB_OUTPUT"
          echo "OCI: ${host} / ${namespace} / ${chart_name} -> ${package_name} (owner=${owner})"

      - name: Helm lint
        id: lint
        run: helm lint "${{ env.CHART_PATH }}"

      - name: Compute package version
        id: version
        env:
          CHART_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          publish=true
          if [[ "${{ github.event_name }}" == "release" ]]; then
            # Releases in this repository are app releases (v1.4.0, ...).
            # A stable chart version is only published when Chart.yaml's
            # version matches the release tag (leading 'v' optional);
            # otherwise the run is a no-op rather than a failure, so app
            # releases don't turn red here.
            stripped="${RELEASE_TAG#v}"
            version="${CHART_VERSION}"
            if [[ "${stripped}" != "${CHART_VERSION}" ]]; then
              publish=false
              echo "::notice::Release tag ${RELEASE_TAG} is not chart version ${CHART_VERSION}; skipping chart publish (app release)."
            fi
          else
            # For main-branch pushes, use the full triggering commit SHA as
            # the unique SemVer build suffix so every commit produces a
            # distinct, installable chart. Using the full SHA removes the
            # 7-char abbreviation that `git rev-parse --short` returns and
            # eliminates the (rare) collision risk.
            version="${CHART_VERSION}-tip.${{ github.sha }}"
          fi
          {
            echo "version=${version}"
            echo "publish=${publish}"
          } >> "$GITHUB_OUTPUT"

      # Package after the package version is known, so the .tgz filename
      # matches what `Push chart OCI artifact` reads below. Previously the
      # package step ran before the version was computed, and the .tgz for
      # main-branch pushes had the wrong name (e.g. open-connector-0.1.0.tgz
      # vs. the expected open-connector-0.1.0-tip.<sha>.tgz).
      - name: Helm package
        id: pkg
        if: steps.version.outputs.publish == 'true'
        run: |
          helm package "${{ env.CHART_PATH }}" \
            --destination .charts \
            --version "${{ steps.version.outputs.version }}"

      - name: Log in to registry
        id: login
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.oci.outputs.host }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart OCI artifact
        id: push-chart
        if: steps.version.outputs.publish == 'true'
        run: |
          # The version embedded in the .tgz filename is what helm push
          # uses as the OCI tag. We deliberately do NOT pass --version:
          # doing so would create a duplicate OCI manifest under a
          # different tag instead of referencing the same artifact.
          tgz=".charts/${{ steps.meta.outputs.name }}-${{ steps.version.outputs.version }}.tgz"
          helm push "${tgz}" "${{ env.OCI_REPO }}"

      - name: Tag release as 'latest'
        id: tag-latest
        if: steps.version.outputs.publish == 'true' && github.event_name == 'release' && github.event.release.prerelease == false
        env:
          REGISTRY: ${{ steps.oci.outputs.host }}/${{ steps.oci.outputs.namespace }}
          CHART_NAME: ${{ steps.oci.outputs.chart_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Copy the just-pushed manifest to the "latest" tag via ORAS
          # so we reference the same OCI artifact instead of duplicating
          # it. This is a separate tag flow from the main helm push above.
          curl -sSfLo /tmp/oras.tgz \
            "https://github.com/oras-project/oras/releases/download/v1.2.2/oras_1.2.2_linux_amd64.tar.gz"
          # Pin the download to its published SHA-256 so a tampered or
          # repackaged upstream release fails the workflow before we
          # extract the binary.
          echo "bff970346470e5ef888e9f2c0bf7f8ee47283f5a45207d6e7a037da1fb0eae0d  /tmp/oras.tgz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f /tmp/oras.tgz oras

          oras copy \
            "${REGISTRY}/${CHART_NAME}:${VERSION}" \
            "${REGISTRY}/${CHART_NAME}:latest"

      - name: Workflow summary
        if: always()
        env:
          SETUP_HELM_RESULT: ${{ steps.setup-helm.conclusion }}
          META_RESULT: ${{ steps.meta.conclusion }}
          LINT_RESULT: ${{ steps.lint.conclusion }}
          PACKAGE_RESULT: ${{ steps.pkg.conclusion }}
          LOGIN_RESULT: ${{ steps.login.conclusion }}
          PUSH_RESULT: ${{ steps.push-chart.conclusion }}
          TAG_LATEST_RESULT: ${{ steps.tag-latest.conclusion }}
          PUBLISH_GATE: ${{ steps.version.outputs.publish }}
        run: |
          {
            # Required for "published": push-chart succeeded.
            # tag-latest is only required when it actually runs (non-prerelease
            # release); on push events and prereleases it's skipped, not failed.
            push="${PUSH_RESULT:-skipped}"
            tag_latest="${TAG_LATEST_RESULT:-skipped}"

            if [[ "${PUBLISH_GATE}" == "false" ]]; then
              echo "## Helm chart publish skipped"
              echo
              echo "This release tag does not match the chart version ${{ steps.meta.outputs.version }} (app release). No chart was published."
            elif [[ "${push}" == "success" ]] && [[ "${tag_latest}" != "failure" ]]; then
              echo "## Helm chart published"
              echo
              echo "- **Chart**: \`${{ steps.meta.outputs.name }}\`"
              echo "- **Version**: \`${{ steps.version.outputs.version }}\`"
              echo "- **Registry**: \`${{ env.OCI_REPO }}\`"
              echo
              echo "Install with:"
              echo '```'
              echo "helm install open-connector \\"
              echo "  ${{ env.OCI_REPO }}/${{ steps.meta.outputs.name }} \\"
              echo "  --version ${{ steps.version.outputs.version }}"
              echo '```'
              echo
              echo "Note: the ghcr.io package is private after its first publish; flip \`${{ steps.oci.outputs.package_name }}\` to public once in the GitHub Packages UI so \`helm pull\` works without auth."
            else
              echo "## Helm chart publish failed"
              echo
              echo "The chart was **not** fully published. Do not install from this run."
              echo
              echo "| Step | Result |"
              echo "| --- | --- |"
              echo "| Setup Helm | \`${SETUP_HELM_RESULT:-skipped}\` |"
              echo "| Read chart metadata | \`${META_RESULT:-skipped}\` |"
              echo "| Lint | \`${LINT_RESULT:-skipped}\` |"
              echo "| Package | \`${PACKAGE_RESULT:-skipped}\` |"
              echo "| Registry login | \`${LOGIN_RESULT:-skipped}\` |"
              echo "| Push chart OCI artifact | \`${PUSH_RESULT:-skipped}\` |"
              if [[ "${{ github.event_name }}" == "release" ]]; then
                echo "| Tag release as 'latest' | \`${TAG_LATEST_RESULT:-skipped}\` |"
              fi
              echo
              echo "Inspect the failing step's logs above for the cause."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
